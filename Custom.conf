#!name=🛠 自定义优化规则
#!desc=长桥代理 / 国内AI直连 / 联通直连 / APNs推送 / YouTube去广告 / 网页净化 / 微信阅读优化


[General]

# Script Hub转换支持
force-http-engine-hosts = %APPEND% script.hub, *.script.hub


[Rule]


# 长桥证券 → 代理
# 优化行情和交易稳定性
DOMAIN-SUFFIX,lbkrs.com,PROXY
DOMAIN-SUFFIX,longbridge.app,PROXY
DOMAIN-SUFFIX,longbridge.global,PROXY
DOMAIN-SUFFIX,longportapp.com,PROXY
DOMAIN-SUFFIX,longbridge.com,PROXY
DOMAIN-SUFFIX,longport.com,PROXY


# 中国联通 → 直连
# 避免运营商业务异常
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/ChinaUnicom/ChinaUnicom.list,DIRECT


# 国内AI服务 → 直连
# 提升访问速度和稳定性

# 通义千问
DOMAIN-SUFFIX,qianwen.com,DIRECT
DOMAIN-SUFFIX,tongyi.aliyun.com,DIRECT
DOMAIN-SUFFIX,dashscope.aliyuncs.com,DIRECT

# DeepSeek
DOMAIN-SUFFIX,deepseek.com,DIRECT

# Kimi
DOMAIN-SUFFIX,kimi.com,DIRECT
DOMAIN-SUFFIX,moonshot.cn,DIRECT

# 智谱AI
DOMAIN-SUFFIX,zhipuai.cn,DIRECT
DOMAIN-SUFFIX,chatglm.cn,DIRECT

# 豆包
DOMAIN-SUFFIX,doubao.com,DIRECT

# 腾讯混元
DOMAIN-SUFFIX,hunyuan.tencent.com,DIRECT

# 百度文心
DOMAIN-SUFFIX,ernie.baidu.com,DIRECT



# Apple APNs推送 → 代理
# 优化通知延迟
DOMAIN-SUFFIX,push.apple.com,PROXY

IP-CIDR,17.249.0.0/16,PROXY,no-resolve
IP-CIDR,17.252.0.0/16,PROXY,no-resolve
IP-CIDR,17.57.144.0/22,PROXY,no-resolve
IP-CIDR,17.188.128.0/18,PROXY,no-resolve



# YouTube去广告辅助
# 屏蔽广告请求
AND,((DOMAIN-SUFFIX,googlevideo.com),(PROTOCOL,UDP)),REJECT
AND,((DOMAIN,youtubei.googleapis.com),(PROTOCOL,UDP)),REJECT
AND,((DOMAIN-SUFFIX,youtube.com),(PROTOCOL,QUIC)),REJECT



# 墨鱼手记脚本稳定
AND,((DOMAIN-SUFFIX,ddgksf2013.top),(PROTOCOL,QUIC)),REJECT-NO-DROP



# 中国大陆网站直连
GEOIP,CN,DIRECT


# 其他流量代理
FINAL,PROXY



[URL Rewrite]


# YouTube广告拦截
^https?:\/\/[\w-]+\.googlevideo\.com\/initplayback.+&oad - reject-200


# Pornhub广告拦截
^https?:\/\/(cn|www)\.pornhub\.com\/_xa\/ads - reject-dict



[Script]


# YouTube去广告（Maasea）
# 需要HTTPS解密

youtube.response = type=http-response, pattern=^https:\/\/youtubei\.googleapis\.com\/(youtubei\/v1\/(browse|next|player|search|reel\/reel_watch_sequence|guide|account\/get_setting|get_watch))(\?(.*))?$, script-path=https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.response.js, requires-body=true, binary-body-mode=true, max-size=0,argument={"lyricLang":"off","captionLang":"off","blockUpload":true,"blockImmersive":true,"blockShorts":true,"debug":false}


# 墨鱼网页变身
网页变身 = type=http-response, pattern=^https?:\/\/ddgksf2013.top\/$,requires-body=1,max-size=-1,script-path=https://ddgksf2013.top/scripts/web.rocket.js,timeout=3500


# Script Hub转换
脚本转换 = type=http-request,pattern=^https?:\/\/script\.hub\/file\/_start_\/.+type=(?:qx-rewrite|surge-module|all-module),script-path=https://raw.githubusercontent.com/Script-Hub-Org/Script-Hub/main/Rewrite-Parser.js,timeout=300


# Pornhub净化
pornhub.ads = type=http-response,pattern=^https?:\/\/(cn|www)\.pornhub\.com\/,script-path=https://ddgksf2013.top/scripts/pornhub.ads.js,requires-body=true,max-size=-1,timeout=60


# Reddit净化
reddit = type=http-response,pattern=^https?:\/\/gql-fed\.reddit\.com\/$,script-path=https://raw.githubusercontent.com/ddgksf2013/Scripts/refs/heads/master/reddit.js,requires-body=true,max-size=-1,timeout=60


# MissAV净化
missav.ads = type=http-response,pattern=^https?:\/\/missav\.(ws|live|com|ai)\/,script-path=https://ddgksf2013.top/scripts/missav.ads.js,requires-body=true,max-size=-1,timeout=60


# 微信读书优化
# 去红点和阅读页面冗余信息
WeRead = type=http-response,pattern=https:\/\/i\.weread\.qq\.com\/(book\/(reading[sS]tat|chapterReview)|user\/profile|groups\/readerEntrance|review\/list|mobileSync),requires-body=1,max-size=0,script-path=https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/WeRead/weread.js



[MITM]


# HTTPS解密域名
# 仅用于脚本功能

hostname = %APPEND% *.googlevideo.com,youtubei.googleapis.com,ddgksf2013.top,cn.pornhub.com,www.pornhub.com,gql-fed.reddit.com,missav.live,missav.ws,missav.ai,missav.com,i.weread.qq.com,script.hub,*.script.hub
