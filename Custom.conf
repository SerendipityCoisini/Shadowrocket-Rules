#!name=自定义规则
#!desc=长桥代理 / APNs推送 / YouTube去广告
# 最后更新: 2026-11-06

[Rule]

# 长桥证券 → 代理
DOMAIN-SUFFIX,lbkrs.com,PROXY
DOMAIN-SUFFIX,longbridge.app,PROXY
DOMAIN-SUFFIX,longbridge.global,PROXY
DOMAIN-SUFFIX,longportapp.com,PROXY
DOMAIN-SUFFIX,longbridge.com,PROXY
DOMAIN-SUFFIX,longport.com,PROXY
DOMAIN-SUFFIX,longbridgeapp.com,PROXY
DOMAIN-SUFFIX,longbridge.hk,PROXY
DOMAIN-SUFFIX,longbridge.sg,PROXY
DOMAIN-SUFFIX,longbridgehk.com,PROXY
DOMAIN-SUFFIX,longbridge.cloud,PROXY

# Apple APNs推送 → 代理
DOMAIN-SUFFIX,push.apple.com,PROXY
DOMAIN-SUFFIX,akadns.net,PROXY
DOMAIN-KEYWORD,apple.com.edgekey.net,PROXY

IP-CIDR,17.249.0.0/16,PROXY,no-resolve
IP-CIDR,17.252.0.0/16,PROXY,no-resolve
IP-CIDR,17.57.144.0/22,PROXY,no-resolve
IP-CIDR,17.188.128.0/18,PROXY,no-resolve
IP-CIDR,17.188.20.0/23,PROXY,no-resolve
IP-CIDR6,2620:149:a44::/48,PROXY,no-resolve
IP-CIDR6,2403:300:a42::/48,PROXY,no-resolve
IP-CIDR6,2403:300:a51::/48,PROXY,no-resolve
IP-CIDR6,2a01:b740:a42::/48,PROXY,no-resolve

# YouTube去广告辅助 → 屏蔽走UDP/QUIC的广告请求（QUIC会绕过MITM，必须保留）
AND,((DOMAIN-SUFFIX,googlevideo.com), (PROTOCOL,UDP)),REJECT
AND,((DOMAIN,youtubei.googleapis.com), (PROTOCOL,UDP)),REJECT


[URL Rewrite]

# YouTube广告拦截
(^https?:\/\/[\w-]+\.googlevideo\.com\/(?!dclk_video_ads).+?)&ctier=L(&.+?),ctier,(.+) $1$2$3 302
^https?:\/\/[\w-]+\.googlevideo\.com\/(?!(dclk_video_ads|videoplayback\?)).+&oad - reject-200
^https?:\/\/(www|s)\.youtube\.com\/api\/stats\/ads - reject-200
^https?:\/\/(www|s)\.youtube\.com\/(pagead|ptracking) - reject-200
^https?:\/\/s\.youtube\.com\/api\/stats\/qoe\?adcontext - reject-200


[Script]

# YouTube去广告（含屏蔽Shorts；已对齐Maasea上游最新版）
youtube.response = type=http-response, pattern=^https:\/\/youtubei\.googleapis\.com\/(youtubei\/v1\/(browse|next|player|search|reel\/reel_watch_sequence|guide|account\/get_setting|get_watch|log_event|config))(\?(.*))?$, script-path=https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.response.js, requires-body=true, binary-body-mode=true, max-size=0,argument={"captionLang":"off","blockUpload":true,"blockImmersive":true,"blockShorts":true,"debug":false}
youtube.request.init = type=http-request, pattern=^https?:\/\/[\w-]+\.googlevideo\.com\/initplayback.+&ack.*, script-path=https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.request.js, requires-body=true, binary-body-mode=true, max-size=-1,argument={"captionLang":"off"}
youtube.request.log_event = type=http-request, pattern=^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/log_event, script-path=https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.request.js, requires-body=true, binary-body-mode=true, max-size=-1


[MITM]

hostname = %APPEND% -redirector*.googlevideo.com,*.googlevideo.com,www.youtube.com,s.youtube.com,youtubei.googleapis.com
